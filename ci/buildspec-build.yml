# Build stage: Expo web export (secondary source "frontend") + ARM image in ECR.
# Immutable tag <backend sha>-<frontend sha>; if it already exists in ECR, reuse it without a new push.
# BACKEND_SHA, FRONTEND_SHA and ECR_REPOSITORY_URL come from the pipeline/project (infra/aws/cicd.tf).
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - export IMAGE_TAG="$(echo "$BACKEND_SHA" | cut -c1-7)-$(echo "$FRONTEND_SHA" | cut -c1-7)"
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
  build:
    commands:
      - |
        set -e
        if aws ecr describe-images --repository-name "${ECR_REPOSITORY_URL#*/}" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
          echo "Image $IMAGE_TAG already exists in ECR; skipping build."
        else
          bash scripts/build_frontend.sh "$CODEBUILD_SRC_DIR_frontend"
          docker build --build-arg APP_VERSION="$IMAGE_TAG" -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" .
          docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
        fi
  post_build:
    commands:
      - echo "IMAGE_TAG=$IMAGE_TAG" > image.env

artifacts:
  files:
    - image.env
